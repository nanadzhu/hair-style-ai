<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朱老师发型设计助手 · 流程测试版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:#21342e;background:#f5f6f3}*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;padding:22px 16px 60px}h1{font-size:25px;margin:10px 0}h2{font-size:19px}p{line-height:1.65;color:#64716a}.tag{font-size:12px;background:#fff1d6;color:#805d1c;padding:5px 10px;border-radius:20px}section{background:white;padding:20px;border-radius:18px;margin:16px 0;box-shadow:0 4px 18px #233a2b08}label{display:block;font-weight:600;margin:14px 0 8px}input,select{width:100%;padding:13px;border:1px solid #d8ddd8;border-radius:11px;background:#fff;font-size:16px}button{width:100%;border:0;border-radius:12px;background:#1c5144;color:white;padding:16px;font-size:17px;font-weight:650;margin-top:15px}button:disabled{opacity:.5}.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photos img{width:100%;height:170px;object-fit:contain;background:#f2f3f0;border-radius:10px;margin-top:8px}.hidden{display:none}.card{border:1px solid #e0e6e0;border-radius:12px;padding:13px;margin-top:12px}.muted{font-size:13px;color:#66746d}.status{color:#9b531b}ul{padding-left:20px;line-height:1.8}</style></head><body><main class="app"><span class="tag">V1 · 固定四步流程测试版</span><h1>朱老师发型设计助手</h1><p>拍照 → 少量需求 → 自动处理 → 直接显示结果。无需人工确认或纠正。</p>
<section><h2>① 拍摄顾客照片</h2><div class="photos"><div><label for="front">正面照片（必选）</label><input id="front" type="file" accept="image/*" capture="environment"><img id="frontPreview" alt="正面照片预览" class="hidden"></div><div><label for="side">侧面照片（建议）</label><input id="side" type="file" accept="image/*" capture="environment"><img id="sidePreview" alt="侧面照片预览" class="hidden"></div></div><p class="muted">照片仅在当前浏览器预览，不上传服务器。请先获得顾客授权。</p></section>
<section><h2>② 采集少量需求</h2><label for="intent">主要需求</label><select id="intent"><option>想换一个适合自己的发型</option><option>头顶塌、希望显发量</option><option>毛躁、希望更好打理</option><option>希望修饰脸型</option><option>想保留长度但改变感觉</option></select><label for="length">希望长度</label><select id="length"><option>由系统推荐</option><option>短发</option><option>齐肩</option><option>锁骨发</option><option>长发</option></select><label for="care">每天愿意打理多久</label><select id="care"><option>几乎不打理</option><option>5分钟以内</option><option>10分钟以内</option><option>10分钟以上</option></select><button id="go" type="button">③ 开始生成设计结果</button><p id="status" role="status"></p></section>
<section id="results" class="hidden"><h2>④ 设计结果</h2><p class="status"><strong>当前为交互演示：</strong>下方是根据选项生成的规则示例，不是AI看图诊断，也不是生成的发型效果图。正式自动分析与生图需要接入可用的AI服务。</p><div id="summary"></div><div id="cards"></div><button id="reset" type="button">重新设计下一位顾客</button></section></main>
<script>(function(){'use strict';const $=id=>document.getElementById(id);let urls={};for(const k of ['front','side']){$(k).addEventListener('change',()=>{if(urls[k])URL.revokeObjectURL(urls[k]);const f=$(k).files[0],im=$(k+'Preview');if(!f){im.classList.add('hidden');return}if(!f.type.startsWith('image/')){$('status').textContent='请选择图片文件';return}urls[k]=URL.createObjectURL(f);im.src=urls[k];im.classList.remove('hidden')})}function node(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}$('go').addEventListener('click',()=>{if(!$('front').files.length){$('status').textContent='请先拍摄或选择正面照片';return}const intent=$('intent').value,length=$('length').value,care=$('care').value;const plans=intent.includes('头顶塌')?['轻盈短发纹理','锁骨蓬松大弯','自然层次中发']:intent.includes('毛躁')?['柔顺锁骨发','低层次自然弯','利落齐肩发']:intent.includes('保留长度')?['长发柔和层次','自然大弯','低层次波浪']:['锁骨自然大弯','轻盈短发纹理','柔和齐肩层次'];$('summary').replaceChildren(node('p','需求：'+intent+'｜长度：'+length+'｜打理：'+care));const area=$('cards');area.replaceChildren();plans.forEach((name,i)=>{const card=node('div','');card.className='card';card.append(node('strong','方向 '+(i+1)+'：'+name),node('p','示例建议：实际适配性须结合照片分析、发质及烫染史判断。'+(care==='几乎不打理'?' 优先考虑回家洗吹容易维持的造型。':' 需说明日常吹整方法。')),node('p','效果图：尚未生成（未连接图像模型）。'));area.append(card)});$('results').classList.remove('hidden');$('status').textContent='演示结果已生成';$('results').scrollIntoView({behavior:'smooth',block:'start'})});$('reset').onclick=()=>{for(const k of ['front','side']){if(urls[k])URL.revokeObjectURL(urls[k]);delete urls[k];$(k).value='';$(k+'Preview').classList.add('hidden')}$('results').classList.add('hidden');$('status').textContent='';window.scrollTo({top:0,behavior:'smooth'})}})();</script></body></html>

.check{background:#856c46}.card-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.member-option{border:1px solid #75654e;background:#322b23;color:#eee0c8;border-radius:9px;padding:13px 6px;text-align:center;font-size:13px;line-height:1.9}.member-option.active{border-color:#e2bd81;background:#59452f}.member-option strong{font-size:22px;color:#f3d09a}.total-line{display:flex;justify-content:space-between;border-bottom:1px solid #665744;padding:10px 0;gap:8px;font-size:14px}.grand{font-size:24px;color:#f0c98d}.action{background:#665039;color:#fff0d5;border:1px solid #a98a5c;padding:12px;border-radius:7px;margin-top:15px;width:100%;font-size:14px}.muted{color:#b8a991;font-size:12px}.page h2{margin:16px 0 22px}.page{padding:24px 20px}.row{font-size:13px;padding:11px 0}.row small{font-size:11px}.page::-webkit-scrollbar{width:3px}.page::-webkit-scrollbar-thumb{background:#806b4d}.summary-mini{position:absolute;bottom:0;left:0;right:0;background:#201b17ed;border-top:1px solid #81684a;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;font-size:12px;z-index:3}.summary-mini button{background:#68513a;border:0;color:#f5e4cb;border-radius:5px;padding:7px 10px}.page.has-mini{padding-bottom:28px}.page.has-mini .summary-mini{position:relative;bottom:auto;left:auto;right:auto;margin:22px 0 0;padding:13px 12px;z-index:auto;box-shadow:none;border:1px solid #81684a;border-radius:7px;flex-wrap:wrap;gap:8px}.page.has-mini .row{min-height:67px}.page.has-mini .row .prices{gap:2px}.page.has-mini .row b{line-height:1.3}.notice-date{font-size:13px;color:#e8c58c;letter-spacing:1px;margin-top:26px}.notice-copy{font-size:19px;line-height:2.1;color:#f4e5cf;margin:20px 0}.notice-copy strong,.notice-rule strong{color:#f4c98a}.notice-rule{padding:20px 17px;border:1px solid #9e815b;border-radius:8px;background:#3c3026;font-size:16px;line-height:2;color:#eee0c8}/* Compact full-page service layout: no vertical scrolling required on typical phones */.page.has-mini{padding:13px 15px 12px;overflow-y:hidden;display:none;flex-direction:column}.page.has-mini.active{display:flex}.page.has-mini .ey{font-size:9px;letter-spacing:1.7px;line-height:1.25}.page.has-mini h2{font-size:clamp(18px,3.4svh,25px);margin:7px 0 7px;line-height:1.15}.page.has-mini .row{flex:1 1 0;min-height:0;padding:2px 0;font-size:clamp(10px,1.75svh,13px);gap:6px}.page.has-mini .check{width:15px;height:15px;flex-basis:15px;font-size:10px}.page.has-mini .row .prices{gap:0;line-height:1.18}.page.has-mini .row small{font-size:clamp(9px,1.4svh,11px);line-height:1.25}.page.has-mini .row b{font-size:clamp(10px,1.7svh,12px);line-height:1.28}.page.has-mini p{flex:0 0 auto;margin:5px 0;font-size:clamp(9px,1.45svh,11px);line-height:1.35}.page.has-mini .summary-mini{flex:0 0 auto;position:relative;margin:7px 0 0;padding:6px 8px;font-size:clamp(10px,1.5svh,12px);gap:5px;flex-wrap:nowrap}.page.has-mini .summary-mini button{padding:6px 8px;font-size:11px;white-space:nowrap}@media(max-height:650px){.page.has-mini{padding:10px 13px}.page.has-mini h2{margin:5px 0}.page.has-mini .summary-mini{margin-top:4px;padding:4px 6px}.page.has-mini p{margin:3px 0}}</style></head><body><main class="book" id="book" aria-label="子森美学朱老师价格画册"><section class="page cover active"><img src="./cover.jpg.PNG?original=1" alt="朱老师选定的高清人物封面" loading="eager"></section></main><script>const data=[["封面",[]],["目录",[]],["剪发与造型",[["朱老师剪发",198,138],["剪后护理",198,138],["刘海修剪",68,38],["一次性造型",198,98]]],["烫发系列",[["发根重塑",399,299],["纹理烫",599,489],["沙发类",799,599],["品质烫",899,679],["全头烫",999,749],["奢华烫",1199,899]]],["单色染",[["基础色",599,399],["两段发色",799,519],["多段发色",1199,899]]],["设计染与褪色",[["局部双色",1199,899],["双色染",1699,1199],["设计染",1999,1399],["10cm褪色",200,189],["长度待确认",400,319],["50cm褪色",600,459]]]];const book=document.getElementById('book');const services=[];data.slice(2).forEach((group,g)=>group[1].forEach((x,i)=>services.push({id:g+'-'+i,group:group[0],name:x[0],price:x[1],oldMember:x[2]})));let selected=new Set(),rate=.8,page=0;const yuan=n=>'¥'+(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});function totals(){let items=services.filter(s=>selected.has(s.id));return{items,original:items.reduce((v,s)=>v+s.price,0),discount:items.reduce((v,s)=>v+Math.round(s.price*rate*100)/100,0)}}function itemRow(s){return '<div class="row '+(selected.has(s.id)?'selected':'')+'" data-item="'+s.id+'" role="button" tabindex="0"><span class="check">'+(selected.has(s.id)?'✓':'')+'</span><span style="flex:1">'+s.name+'</span><span class="prices"><small>原价 '+yuan(s.price)+'</small><b>八折 '+yuan(s.price*.8)+'</b><b>七折 '+yuan(s.price*.7)+'</b></span></div>'}const pages=[...book.querySelectorAll('.page')];function addPage(content,extra=''){let el=document.createElement('section');el.className='page '+extra;el.innerHTML=content;book.append(el);pages.push(el);return el}addPage('<div class="ey">CONTENTS</div><h2>服务目录</h2><p>01 价格服务与更新<br>02 会员卡与折扣<br>03 剪发与造型<br>04 烫发系列<br>05 单色染<br>06 设计染与褪色<br>07 已选项目与总价</p><p>点击项目即可加入清单，左右滑动翻页。</p>');addPage('<div class="ey">ZISEN BEAUTY / NOTICE</div><h2>价格服务与更新</h2><p class="notice-date">2027年5月20日</p><p class="notice-copy">剪发价格由 <strong>¥198</strong> 调整至 <strong>¥238</strong>。</p><div class="notice-rule">2027年5月20日之前办理的会员卡，卡内剪发消费依旧按照 <strong>¥198</strong> 为基准价格享受相应会员折扣。</div>','notice');const member=addPage('', 'member');data.slice(2).forEach((d,g)=>addPage('<div class="ey">ZISEN BEAUTY / SERVICE</div><h2>'+d[0]+'</h2>'+services.filter(s=>s.group===d[0]).map(itemRow).join('')+(g===1?'<p>烫染不含设计修剪；发长超过50cm加收300元。</p>':'')+(g===3?'<p>原价格表部分褪色长度标注待核对。</p>':''),'has-mini'));const summary=addPage('','summary');function update(){const t=totals();member.innerHTML='<div class="ey">ZISEN BEAUTY / MEMBERSHIP</div><h2>会员卡权益</h2><div class="card-options"><button class="member-option '+(rate===.8?'active':'')+'" data-rate="0.8">充值 ¥1,000<br><strong>八折卡</strong><br>消费享 8 折</button><button class="member-option '+(rate===.7?'active':'')+'" data-rate="0.7">充值 ¥2,000<br><strong>七折卡</strong><br>消费享 7 折</button></div><p>点击选择会员卡，自动计算本次服务总价。充值金额与本次消费金额分开计算。</p><div class="total-line"><span>当前会员折扣</span><b>'+(rate===.8?'八折（80%）':'七折（70%）')+'</b></div><div class="total-line"><span>已选服务</span><b>'+t.items.length+' 项</b></div><div class="total-line"><span>本次会员消费</span><b class="grand">'+yuan(t.discount)+'</b></div><button class="action" data-page="8">查看已选项目及总价</button>';pages.slice(4,8).forEach((el,g)=>{const d=data[g+2];el.querySelectorAll('.row').forEach(node=>{const yes=selected.has(node.dataset.item);node.classList.toggle('selected',yes);node.querySelector('.check').textContent=yes?'✓':''});let mini=el.querySelector('.summary-mini');if(!mini){mini=document.createElement('div');mini.className='summary-mini';el.append(mini)}mini.innerHTML='<span>已选 '+t.items.length+' 项 · '+(rate===.8?'八折':'七折')+' <b>'+yuan(t.discount)+'</b></span><button data-page="8">查看合计</button>'});summary.innerHTML='<div class="ey">ZISEN BEAUTY / BILL</div><h2>已选服务与总价</h2><p class="muted">当前使用：'+(rate===.8?'充值1000元八折卡':'充值2000元七折卡')+'</p>'+(t.items.length?t.items.map(s=>'<div class="total-line"><span>'+s.name+'</span><span>'+yuan(s.price*rate)+'</span></div>').join(''):'<p>还没有选择项目。翻到服务页，点击项目即可加入。</p>')+'<div class="total-line"><span>原价合计</span><span>'+yuan(t.original)+'</span></div><div class="total-line"><span>会员优惠</span><span>−'+yuan(t.original-t.discount)+'</span></div><div class="total-line"><b>本次消费合计</b><b class="grand">'+yuan(t.discount)+'</b></div><p class="muted">会员充值金额不计入本次消费合计。各项目折扣价按标价计算，最终以门店确认为准。</p><button class="action" data-clear="1">清空已选项目</button>'}function go(delta){let next=Math.max(0,Math.min(pages.length-1,page+delta));if(next===page)return;pages[page].classList.remove('active');page=next;pages[page].classList.add('active')}function goto(n){pages[page].classList.remove('active');page=Math.max(0,Math.min(pages.length-1,n));pages[page].classList.add('active')}book.addEventListener('click',e=>{const item=e.target.closest('[data-item]');if(item){let id=item.dataset.item;selected.has(id)?selected.delete(id):selected.add(id);update();return}const card=e.target.closest('[data-rate]');if(card){rate=Number(card.dataset.rate);update();return}const dest=e.target.closest('[data-page]');if(dest){goto(Number(dest.dataset.page));return}if(e.target.closest('[data-clear]')){selected.clear();update();return}let b=book.getBoundingClientRect();go(e.clientX-b.left<b.width*.42?-1:1)});let sx=0,sy=0;book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});book.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){go(dx<0?1:-1);e.preventDefault()}},{passive:false});update();</script></body></html>

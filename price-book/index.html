<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>子森美学 · 朱老师价格画册</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#161510;color:#e9ddcb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:18px}.book{position:relative;width:min(88vw,420px);height:min(84svh,750px);min-height:380px;overflow:hidden;border-radius:4px 13px 13px 4px;background:#2a241e;box-shadow:0 18px 42px #0009;touch-action:pan-y}.page{display:none;position:absolute;inset:0;padding:28px 24px;overflow-y:auto;background:radial-gradient(circle at 75% 10%,#5b4935,#24211d 75%)}.page.active{display:block}.page.cover{padding:0;background:#1d1a17}.cover img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}.ey{color:#d5b784;letter-spacing:3px;font-size:11px}h2{font-size:30px;font-weight:400;margin:22px 0 30px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #625441;font-size:15px}.row span:last-child{text-align:right;white-space:nowrap}.row small{display:block;color:#baad9a}.row b{color:#e6c38d}p{color:#c7b9a5;font-size:13px;line-height:2}.book:after{content:"";position:absolute;top:0;bottom:0;left:0;width:7px;pointer-events:none;background:linear-gradient(90deg,#0005,transparent)}.cover:after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid #ffffff20}</style></head><body><main class="book" id="book" aria-label="子森美学朱老师价格画册"><section class="page cover active"><img src="./cover.jpg.PNG?original=1" alt="朱老师选定的高清人物封面" loading="eager"></section></main><script>const data=[["封面",[]],["目录",[]],["剪发与造型",[["朱老师剪发",198,138],["剪后护理",198,138],["刘海修剪",68,38],["一次性造型",198,98]]],["烫发系列",[["发根重塑",399,299],["纹理烫",599,489],["沙发类",799,599],["品质烫",899,679],["全头烫",999,749],["奢华烫",1199,899]]],["单色染",[["基础色",599,399],["两段发色",799,519],["多段发色",1199,899]]],["设计染与褪色",[["局部双色",1199,899],["双色染",1699,1199],["设计染",1999,1399],["10cm褪色",200,189],["长度待确认",400,319],["50cm褪色",600,459]]]];const book=document.getElementById('book');data.slice(1).forEach((d,i)=>{let el=document.createElement('section');el.className='page';el.innerHTML=i===0?'<div class="ey">CONTENTS</div><h2>服务目录</h2><p>01 剪发与造型<br>02 烫发系列<br>03 单色染<br>04 设计染与褪色</p>':'<div class="ey">ZISEN BEAUTY / SERVICE</div><h2>'+d[0]+'</h2>'+d[1].map(x=>'<div class="row"><span>'+x[0]+'</span><span><small>原价 ¥'+x[1]+'</small><b>会员 ¥'+x[2]+'</b></span></div>').join('')+(i===2?'<p>烫染不含设计修剪；发长超过50cm加收300元。</p>':'')+(i===4?'<p>原PDF部分褪色长度标注待核对。</p>':'');book.append(el)});const pages=[...book.querySelectorAll('.page')];let page=0;function go(delta){let next=Math.max(0,Math.min(pages.length-1,page+delta));if(next===page)return;pages[page].classList.remove('active');page=next;pages[page].classList.add('active')}book.addEventListener('click',e=>{let b=book.getBoundingClientRect();go(e.clientX-b.left<b.width*.42?-1:1)});let sx=0,sy=0;book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});book.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){go(dx<0?1:-1);e.preventDefault()}},{passive:false});</script></body></html>

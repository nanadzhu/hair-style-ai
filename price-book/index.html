新</h2><p class="notice-date">2027年5月20日</p><p class="notice-copy">剪发价格由 <strong>¥198</strong> 调整至 <strong>¥238</strong>。</p><div class="notice-rule">2027年5月20日之前办理的会员卡，卡内余额剪发消费依旧按照 <strong>¥198</strong> 为基准价格享受相应会员折扣。</div>','notice');const member=addPage('', 'member');data.slice(2).forEach((d,g)=>addPage('<div class="ey">ZISEN BEAUTY / SERVICE</div><h2>'+d[0]+'</h2>'+services.filter(s=>s.group===d[0]).map(itemRow).join('')+(g===1?'<p>烫染不含设计修剪；发长超过50cm加收300元。</p>':'')+(g===3?'<p>原价格表部分褪色长度标注待核对。</p>':''),'has-mini'));const summary=addPage('','summary');function update(){const t=totals();member.innerHTML='<div class="ey">ZISEN BEAUTY / MEMBERSHIP</div><h2>会员卡权益</h2><div class="card-options"><button class="member-option '+(rate===.8?'active':'')+'" data-rate="0.8">充值 ¥1,000<br><strong>八折卡</strong><br>消费享 8 折</button><button class="member-option '+(rate===.7?'active':'')+'" data-rate="0.7">充值 ¥2,000<br><strong>七折卡</strong><br>消费享 7 折</button></div><p>点击选择会员卡，自动计算本次服务总价。充值金额与本次消费金额分开计算。</p><div class="total-line"><span>当前会员折扣</span><b>'+(rate===.8?'八折（80%）':'七折（70%）')+'</b></div><div class="total-line"><span>已选服务</span><b>'+t.items.length+' 项</b></div><div class="total-line"><span>本次会员消费</span><b class="grand">'+yuan(t.discount)+'</b></div><button class="action" data-page="8">查看已选项目及总价</button>';pages.slice(4,8).forEach((el,g)=>{const d=data[g+2];el.querySelectorAll('.row').forEach(node=>{const yes=selected.has(node.dataset.item);node.classList.toggle('selected',yes);node.querySelector('.check').textContent=yes?'✓':''});let mini=el.querySelector('.summary-mini');if(!mini){mini=document.createElement('div');mini.className='summary-mini';el.append(mini)}mini.innerHTML='<span>已选 '+t.items.length+' 项 · '+(rate===.8?'八折':'七折')+' <b>'+yuan(t.discount)+'</b></span><button data-page="8">查看合计</button>'});summary.innerHTML='<div class="ey">ZISEN BEAUTY / BILL</div><h2>已选服务与总价</h2><p class="muted">当前使用：'+(rate===.8?'充值1000元八折卡':'充值2000元七折卡')+'</p>'+(t.items.length?t.items.map(s=>'<div class="total-line"><span>'+s.name+'</span><span>'+yuan(s.price*rate)+'</span></div>').join(''):'<p>还没有选择项目。翻到服务页，点击项目即可加入。</p>')+'<div class="total-line"><span>原价合计</span><span>'+yuan(t.original)+'</span></div><div class="total-line"><span>会员优惠</span><span>−'+yuan(t.original-t.discount)+'</span></div><div class="total-line"><b>本次消费合计</b><b class="grand">'+yuan(t.discount)+'</b></div><p class="muted">会员充值金额不计入本次消费合计。各项目折扣价按标价计算，最终以门店确认为准。</p><button class="action" data-clear="1">清空已选项目</button>'}function go(delta){let next=Math.max(0,Math.min(pages.length-1,page+delta));if(next===page)return;pages[page].classList.remove('active');page=next;pages[page].classList.add('active')}function goto(n){pages[page].classList.remove('active');page=Math.max(0,Math.min(pages.length-1,n));pages[page].classList.add('active')}book.addEventListener('click',e=>{const catalog=e.target.closest('[data-catalog-page]');if(catalog){goto(Number(catalog.dataset.catalogPage));return}const item=e.target.closest('[data-item]');if(item){let id=item.dataset.item;selected.has(id)?selected.delete(id):selected.add(id);update();return}const card=e.target.closest('[data-rate]');if(card){rate=Number(card.dataset.rate);update();return}const dest=e.target.closest('[data-page]');if(dest){goto(Number(dest.dataset.page));return}if(e.target.closest('[data-clear]')){selected.clear();update();return}let b=book.getBoundingClientRect();go(e.clientX-b.left<b.width*.42?-1:1)});let sx=0,sy=0;book.addEventListener('keydown',e=>{const catalog=e.target.closest('[data-catalog-page]');if(catalog&&(e.key==='Enter'||e.key===' ')){e.preventDefault();goto(Number(catalog.dataset.catalogPage))}});book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});book.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){go(dx<0?1:-1);e.preventDefault()}},{passive:false});update();</script
